<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 背景底色与柔和圆角 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- 背景装饰光环 -->
  <circle cx="256" cy="256" r="180" fill="white" opacity="0.08" />
  <circle cx="256" cy="256" r="130" fill="white" opacity="0.08" />

  <!-- 中心立体发光大金星 -->
  <g filter="url(#glow)">
    <polygon points="256,90 295,200 410,200 318,270 353,380 256,310 159,380 194,270 102,200 217,200"
             fill="url(#starGrad)" stroke="#fbbf24" stroke-width="6" stroke-linejoin="round" />
  </g>

  <!-- 金星内部高光小星 -->
  <polygon points="256,120 286,205 375,205 303,260 330,345 256,290 182,345 209,260 137,205 226,205"
           fill="white" opacity="0.2" />

  <!-- 底部装饰小勾 -->
  <circle cx="360" cy="370" r="42" fill="#10b981" stroke="white" stroke-width="6" />
  <path d="M345 370 L356 381 L376 361" fill="none" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>